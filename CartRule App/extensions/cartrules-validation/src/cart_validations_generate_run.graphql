# Input query for the cart.validations.generate.run target.
#
# Tag, collection and customer-tag rules are matched here at checkout with
# hasTags / inCollections, fed by input query variables. The admin app
# writes the variable values (every tag/collection any active rule asks
# about) to the `$app:cartrules/function_variables` metafield on the
# Validation — see syncRulesCache in app/models/rules.server.js and
# [extensions.input.variables] in shopify.extension.toml. The rules
# themselves stay in the shop's `cartrules.rules_cache` metafield, which the
# theme blocks read too.
query Input($productTags: [String!], $collectionIds: [ID!], $customerTags: [String!]) {
  cart {
    lines {
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      discountAllocations {
        discountedAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            title
            vendor
            productType
            hasTags(tags: $productTags) {
              tag
              hasTag
            }
            inCollections(ids: $collectionIds) {
              collectionId
              isMember
            }
          }
        }
      }
    }
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
    buyerIdentity {
      isAuthenticated
      customer {
        hasTags(tags: $customerTags) {
          tag
          hasTag
        }
      }
      purchasingCompany {
        company {
          id
        }
      }
    }
  }
  localization {
    country {
      isoCode
    }
  }
  shop {
    metafield(namespace: "cartrules", key: "rules_cache") {
      value
    }
  }
}
